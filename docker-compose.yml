# For running from a checkout of this repository: `cp .env.example .env`, edit, then
#   docker compose up -d --build
# For Dockge / a home server use dockge/compose.yaml instead (see docs/DEPLOY.md).
services:
  hilde:
    build: .
    image: hilde:local
    restart: unless-stopped
    ports:
      - "${HILDE_PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - hilde-data:/data # the SQLite database lives here, back it up

volumes:
  hilde-data:
