# Copy .env.example to .env, set ADMIN_PASSWORD and NEXTAUTH_SECRET, then: docker compose up -d
services:
  hilde:
    build: .
    # image: ghcr.io/<your-github-user>/hilde:latest   # once the CI workflow has published one
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - hilde-data:/data # the SQLite database lives here, back this up

volumes:
  hilde-data:
